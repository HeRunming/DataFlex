### model
model_name_or_path: Qwen/Qwen2.5-0.5B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 8

### dataset
dataset: alpaca_en_demo
template: qwen2.5
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 0
seed: 42

### output
output_dir: ../dataflex_saves/mmd_emb_rbf
logging_steps: 10
save_steps: 100
plot_loss: true
save_only_model: false
overwrite_output_dir: true

### report
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### dynamic_train - MMD with Embedding RBF Kernel
# Requires pre-computed embeddings (run offline_mmd_selector.py first)
train_type: dynamic_select
components_cfg_file: src/dataflex/configs/components.yaml
component_name: mmd_emb_rbf
warmup_step: 10
update_step: 10
update_times: 2

# MMD-specific: override components.yaml params via this YAML
# These will be passed to the MMDSelector constructor
# To use emb_rbf, set paths to pre-computed .npy embeddings:
#   candidate_embeddings_path: ./path/to/candidate_embeddings.npy
#   target_embeddings_path: ./path/to/target_embeddings.npy

# FORCE_TORCHRUN=1 DISABLE_VERSION_CHECK=1 dataflex-cli train examples/train_lora/selectors/mmd_emb_rbf.yaml
