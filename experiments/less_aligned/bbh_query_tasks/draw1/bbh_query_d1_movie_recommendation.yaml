description: 'Recommend movies similar to the given list of movies.


  '
doc_to_text: 'Q: {{input}}

  A: Let''s think step by step.

  '
fewshot_config:
  sampler: first_n
  samples:
  - input: 'Find a movie similar to Star Wars Episode IV - A New Hope, Indiana Jones and the Last Crusade, Star Wars Episode V - The Empire Strikes Back, The Big Lebowski:

      Options:

      (A) Tetsuo

      (B) the Ironman

      (C) The Princess Bride

      (D) The Barkley Marathons The Race That Eats Its Young

      (E) Bug'
    target: '- Star Wars Episode IV - A New Hope (action, adventure, fantasy; 1977)

      - Indiana Jones and the Last Crusade (action, adventure; 1989)

      - Star Wars Episode V - The Empire Strikes Back (action, adventure, fantasy; 1980)

      - The Big Lebowski (action, drama, comedy; 1998)

      These are all famous classic American movies produced before 2000. Amongst all the options, the only movie similar to these ones seems to be The Princess Bride (1987). So the answer is (C).'
  - input: 'Find a movie similar to Twister, The Silence of the Lambs, Independence Day, Braveheart:

      Options:

      (A) They Shoot Horses

      (B) Don''t They

      (C) Forrest Gump

      (D) The Salton Sea

      (E) Extreme Days'
    target: '- Twister (action, adventure, thriller; 1996)

      - The Silence of the Lambs (crime, drama, thriller; 1991)

      - Independence Day (action, science-fiction, drama; 1996)

      - Braveheart (biography, drama, epic; 1995)

      These are all famous Hollywood movies produced around the 1990s. Amongst all the options, the only movie similar to these ones seems to be Forrest Gump (comedy, drama, romance; 1994). So the answer is (C).'
  - input: 'Find a movie similar to Minority Report, Total Recall, Inside Out, Forrest Gump:

      Options:

      (A) Phenomena

      (B) Lilting

      (C) Catwoman

      (D) Edge of Tomorrow'
    target: '- Minority Report (action, crime, mystery; 2002)

      - Total Recall (action, adventure, science-fiction; 2012)

      - Inside Out (animation, family, comedy; 2015)

      - Forrest Gump (comedy, drama, romance; 1994)

      These are all famous movies produced in the past few decades.Amongst all the options, the only movie similar to these ones seems to be Edge of Tomorrow (action, adventure, crime, mystery; 2014), as it is also a science-fiction movie and features Tom Cruise. So the answer is (D).'
task: bbh_query_d1_movie_recommendation
dataset_path: json
output_type: generate_until
test_split: test
doc_to_target: '{{target}}'
metric_list:
- metric: exact_match
  aggregation: mean
  higher_is_better: true
generation_kwargs:
  max_gen_toks: 1024
  until:
  - </s>
  - Q
  - '


    '
  do_sample: false
  temperature: 0.0
filter_list:
- name: get-answer
  filter:
  - function: regex
    regex_pattern: (?<=the answer is )(.*)(?=.)
  - function: take_first
num_fewshot: 3
metadata:
  version: 3.0
dataset_kwargs:
  data_files:
    test: /jizhicfs/karonhe/DataFlex_fa/experiments/less_aligned/bbh_query_tasks/draw1/data/movie_recommendation_query.jsonl
