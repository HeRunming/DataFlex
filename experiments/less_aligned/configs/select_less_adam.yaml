###############################################################################
# Adam-aware LESS Selection (full LESS protocol)
#
# 1. Load base model + warmup LoRA adapter (from random_selected/checkpoint-1692)
# 2. Load warmup Adam optimizer state (m, v moments)
# 3. Compute Adam-preconditioned gradients on full pool (270k)
# 4. Compute SGD gradients on BBH target set
# 5. Score by mean cosine, select top 5%
###############################################################################

### model
model_name_or_path: /jizhicfs/karonhe/models/shakechen/Llama-2-7b-hf
adapter_name_or_path: /jizhicfs/karonhe/dataflex_saves/sft_results/random_selected/checkpoint-1692
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 512
lora_target: q_proj,k_proj,v_proj,o_proj
lora_dropout: 0.1

### dataset (candidate pool)
dataset: less_train_all
template: llama2
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /jizhicfs/karonhe/dataflex_saves/less_aligned/less_adam
logging_steps: 10
overwrite_output_dir: true
save_steps: 99999

### report
report_to: none

### train - minimal (selection at warmup_step, then stop)
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 1.0
bf16: true
ddp_timeout: 180000000
train_step: 2

### dynamic_train - single-shot LESS (Adam-aware)
train_type: dynamic_select
components_cfg_file: src/dataflex/configs/components.yaml
component_name: less                         # Adam-aware LESS variant
warmup_step: 1
update_step: 1
update_times: 1
selection_ratio: 0.05

# Load Adam moments from warmup checkpoint without resume_from_checkpoint
optimizer_state_path: /jizhicfs/karonhe/dataflex_saves/sft_results/random_selected/checkpoint-1692

## target set
target_dataset: bbh_target_100
eval_dataset: bbh_target_100
eval_strategy: "no"
