###############################################################################
# Gradient-Based Selection Config (MMD-GradCov)
#
# Same protocol as LESS but uses degree-2 polynomial kernel: k(x,y) = <g(x),g(y)>²
# Preserves target gradient covariance / update subspace.
#
# Uses same warmup checkpoint, same proj_dim, same seed as LESS for fair comparison.
###############################################################################

### model - load from warmup checkpoint
model_name_or_path: /jizhicfs/karonhe/models/shakechen/Llama-2-7b-hf
adapter_name_or_path: ../dataflex_saves/less_aligned/warmup_ckpt
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 256
lora_target: q_proj,k_proj,v_proj,o_proj

### dataset (candidate pool)
dataset: alpaca_en_demo
template: llama2
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: ../dataflex_saves/less_aligned/mmd_grad_cov_selection
logging_steps: 10
overwrite_output_dir: true

### report
report_to: none

### train - minimal (selection at warmup_step, then stop)
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 1.0
bf16: true
ddp_timeout: 180000000
train_step: 1

### dynamic_train - single-shot MMD selection
train_type: dynamic_select
components_cfg_file: src/dataflex/configs/components.yaml
component_name: mmd_grad_cov
warmup_step: 0
update_step: 1
update_times: 1
selection_ratio: 0.05  # Select 5% of candidate pool

## target set for MMD selection - MUST be set explicitly
target_dataset: alpaca_zh_demo
eval_dataset: alpaca_zh_demo
eval_strategy: "no"
