###############################################################################
# MMD-Emb-RBF Selection (no gradients needed)
# Uses pre-computed sentence embeddings + RBF kernel + greedy MMD.
###############################################################################

### model
model_name_or_path: /jizhicfs/karonhe/models/shakechen/Llama-2-7b-hf
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 512
lora_target: q_proj,k_proj,v_proj,o_proj
lora_dropout: 0.1

### dataset (candidate pool)
dataset: less_train_all
template: llama2
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /jizhicfs/karonhe/dataflex_saves/less_aligned/mmd_emb_rbf
logging_steps: 10
overwrite_output_dir: true
save_steps: 99999

### report
report_to: none

### train - minimal
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 1.0
bf16: true
ddp_timeout: 180000000
train_step: 5

### dynamic_train
train_type: dynamic_select
components_cfg_file: src/dataflex/configs/components.yaml
component_name: mmd_emb_rbf
warmup_step: 1
update_step: 1
update_times: 1
selection_ratio: 0.05

target_dataset: bbh_target_100
eval_dataset: bbh_target_100
eval_strategy: "no"
