###############################################################################
# Warmup Training Config (LESS protocol) -> produces Adam optimizer state
#
# Train LoRA on 5% random subset of the 270k LESS pool for 4 epochs.
# Effective batch = 32 (per_device=8, grad_accum=4) -> ~1692 steps over 4ep,
# producing checkpoint-1692 with adapter + AdamW optimizer state (m,v moments)
# consumed by the Adam-aware selectors (less_adam, mmd_grad_*_adam).
#
# Output path is the one hardcoded in the *_adam.yaml select configs:
#   /jizhicfs/karonhe/dataflex_saves/sft_results/random_selected/checkpoint-1692
###############################################################################

### model
model_name_or_path: /jizhicfs/karonhe/models/shakechen/Llama-2-7b-hf
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 512
lora_target: q_proj,k_proj,v_proj,o_proj
lora_dropout: 0.1

### dataset (5% random subset of 270k pool)
dataset: less_warmup_5pct
template: llama2
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /jizhicfs/karonhe/dataflex_saves/sft_results/random_selected
logging_steps: 10
save_steps: 1692
save_total_limit: 2
overwrite_output_dir: true

### report
report_to: none

### train - effective batch 32 -> ~1692 steps over 4 epochs
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 4
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
ddp_timeout: 180000000
seed: 42

### static training (no dynamic selection during warmup)
train_type: static
