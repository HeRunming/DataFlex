###############################################################################
# Paper-Level SFT Training Config (LESS-Aligned)
#
# This config is shared by ALL selection methods for fair comparison.
# After offline selection produces selected_indices.json, train on that subset.
#
# Aligned with LESS paper (Xia et al., ICML 2024):
#   - Model: Llama-2-7B
#   - LoRA: rank=128, alpha=256, target=q_proj,k_proj,v_proj,o_proj
#   - Optimizer: AdamW, lr=2e-5, linear scheduler, warmup_ratio=0.03
#   - Batch: effective 128 (per_device=16, grad_accum=8)
#   - Epochs: 3
#   - Weight decay: 0.0
###############################################################################

### model
model_name_or_path: /jizhicfs/karonhe/models/shakechen/Llama-2-7b-hf
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 256
lora_target: q_proj,k_proj,v_proj,o_proj
lora_dropout: 0.05

### dataset
# Override this with the selected subset file path
dataset: alpaca_en_demo
template: llama2
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: ../dataflex_saves/less_aligned/default
logging_steps: 10
save_steps: 500
save_total_limit: 2
overwrite_output_dir: true

### report
report_to: none

### train - LESS paper aligned hyperparams
per_device_train_batch_size: 16
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 3
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
ddp_timeout: 180000000
seed: 42

### NO dynamic training - static SFT on pre-selected subset
train_type: static
