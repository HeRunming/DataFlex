description: 'Questions that involve enumerating objects and asking the model to count them.


  '
doc_to_text: 'Q: {{input}}

  A: Let''s think step by step.

  '
fewshot_config:
  sampler: first_n
  samples:
  - input: I have a blackberry, a clarinet, a nectarine, a plum, a strawberry, a banana, a flute, an orange, and a violin. How many fruits do I have?
    target: 'We first identify the fruits on the list and include their quantity in parentheses:

      - blackberry (1)

      - nectarine (1)

      - plum (1)

      - strawberry (1)

      - banana (1)

      - orange (1)

      Now, let''s add the numbers in parentheses: 1 + 1 + 1 + 1 + 1 + 1 = 6. So the answer is 6.'
  - input: I have an orange, a raspberry, two peaches, a blackberry, an apple, a grape, a nectarine, and three plums. How many fruits do I have?
    target: 'We first identify the fruits on the list and include their quantity in parentheses:

      - orange (1)

      - raspberry (1)

      - peaches (2)

      - blackberry (1)

      - apple (1)

      - grape (1)

      - nectarine (1)

      - plums (3)

      Now, let''s add the numbers in parentheses: 1 + 1 + 2 + 1 + 1 + 1 + 1 + 3 = 11. So the answer is 11.'
  - input: I have a lettuce head, a head of broccoli, an onion, a stalk of celery, two carrots, a garlic, and a yam. How many vegetables do I have?
    target: 'We first identify the vegetables on the list and include their quantity in parentheses:

      - lettuce (1)

      - broccoli (1)

      - onion (1)

      - celery (1)

      - carrots (2)

      - garlic (1)

      - yam (1)

      Now, let''s add the numbers in parentheses: 1 + 1 + 1 + 1 + 2 + 1 + 1 = 8. So the answer is 8.'
task: bbh_external_heldout_object_counting
dataset_path: json
output_type: generate_until
test_split: test
doc_to_target: '{{target}}'
metric_list:
- metric: exact_match
  aggregation: mean
  higher_is_better: true
generation_kwargs:
  max_gen_toks: 1024
  until:
  - </s>
  - Q
  - '


    '
  do_sample: false
  temperature: 0.0
filter_list:
- name: get-answer
  filter:
  - function: regex
    regex_pattern: (?<=the answer is )(.*)(?=.)
  - function: take_first
num_fewshot: 3
metadata:
  version: 3.0
dataset_kwargs:
  data_files:
    test: /jizhicfs/karonhe/DataFlex_fa/experiments/less_aligned/bbh_external_tasks/data/object_counting_heldout.jsonl
