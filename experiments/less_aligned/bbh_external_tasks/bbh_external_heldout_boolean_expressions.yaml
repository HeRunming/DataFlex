description: 'Evaluate the result of a random Boolean expression.


  '
doc_to_text: 'Q: {{input}}

  A: Let''s think step by step.

  '
task: bbh_external_heldout_boolean_expressions
fewshot_config:
  sampler: first_n
  samples:
  - input: not ( ( not not True ) ) is
    target: 'Remember that (i) expressions inside brackets are always evaluated first and that (ii) the order of operations from highest priority to lowest priority is "not", "and", "or", respectively.

      We first simplify this expression "Z" as follows: "Z = not ( ( not not True ) ) = not ( ( A ) )" where "A = not not True".

      Let''s evaluate A: A = not not True = not (not True) = not False = True.

      Plugging in A, we get: Z = not ( ( A ) ) = not ( ( True ) ) = not True = False. So the answer is False.'
  - input: True and False and not True and True is
    target: 'Remember that (i) expressions inside brackets are always evaluated first and that (ii) the order of operations from highest priority to lowest priority is "not", "and", "or", respectively.

      We first simplify this expression "Z" as follows: "Z = True and False and not True and True = A and B" where "A = True and False" and "B = not True and True".

      Let''s evaluate A: A = True and False = False.

      Let''s evaluate B: B = not True and True = not (True and True) = not (True) = False.

      Plugging in A and B, we get: Z = A and B = False and False = False. So the answer is False.'
  - input: not not ( not ( False ) ) is
    target: 'Remember that (i) expressions inside brackets are always evaluated first and that (ii) the order of operations from highest priority to lowest priority is "not", "and", "or", respectively.

      We first simplify this expression "Z" as follows: "Z = not not ( not ( False ) ) = not not ( A )" where "A = not ( False )".

      Let''s evaluate A: A = not ( False ) = not False = True.

      Plugging in A, we get: Z = not not ( A ) = not not (True) = not not False = True. So the answer is True.'
dataset_path: json
output_type: generate_until
test_split: test
doc_to_target: '{{target}}'
metric_list:
- metric: exact_match
  aggregation: mean
  higher_is_better: true
generation_kwargs:
  max_gen_toks: 1024
  until:
  - </s>
  - Q
  - '


    '
  do_sample: false
  temperature: 0.0
filter_list:
- name: get-answer
  filter:
  - function: regex
    regex_pattern: (?<=the answer is )(.*)(?=.)
  - function: take_first
num_fewshot: 3
metadata:
  version: 3.0
dataset_kwargs:
  data_files:
    test: /jizhicfs/karonhe/DataFlex_fa/experiments/less_aligned/bbh_external_tasks/data/boolean_expressions_heldout.jsonl
