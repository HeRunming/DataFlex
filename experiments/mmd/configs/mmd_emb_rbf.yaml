### model
model_name_or_path: Qwen/Qwen2.5-0.5B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 8

### dataset
dataset: alpaca_en_demo
template: qwen2.5
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 0
seed: 42

### output
output_dir: ./experiments/mmd/outputs/mmd_emb_rbf/seed_42
logging_steps: 10
save_steps: 100
plot_loss: true
save_only_model: false
overwrite_output_dir: true

### swanlab
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### dynamic_train
train_type: dynamic_select
components_cfg_file: src/dataflex/configs/components.yaml
component_name: mmd
warmup_step: 10
update_step: 10
update_times: 2

### mmd-specific
kernel_type: emb_rbf
candidate_embeddings_path: ./experiments/mmd/embeddings/candidate_embeddings.npy
target_embeddings_path: ./experiments/mmd/embeddings/target_embeddings.npy
sigma: 1.0
